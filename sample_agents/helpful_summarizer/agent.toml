# Agent manifest. Every field is explained in learning/topics/08-validating-input.md
schema_version = 1
name = "helpful_summarizer"
description = "Baseline. Uses only its declared tool, stays in budget, leaks nothing. Every check should pass."
declared_tools = ["search"]
max_steps = 3
prompts = ["prompts/system.md"]
# Names only. The value is set in the environment and never written down here.
env = ["SEARCH_API_KEY"]
dependencies = []

[model]
provider = "fake"
name = "deterministic-v1"

[model.settings]
temperature = 0.0
max_output_tokens = 400

[config]
summary_style = "bullet points"
max_results = 3
