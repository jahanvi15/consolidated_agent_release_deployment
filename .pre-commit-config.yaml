# Runs fast checks before each local commit. CI is still the source of truth.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: no-commit-to-main
        name: block commits on main
        entry: bash -c 'test "$(git rev-parse --abbrev-ref HEAD)" != "main" || { echo "Commit on a branch, not main."; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true
