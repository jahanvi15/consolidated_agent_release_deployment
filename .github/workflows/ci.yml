name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Same steps, same order as `make check`.
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest

  # The single check that branch protection requires (see ADR 0004).
  # Add new jobs to `needs` instead of editing branch protection.
  ci-pass:
    name: ci-pass
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r)"
              exit 1
            fi
          done
